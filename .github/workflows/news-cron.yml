name: news-cron
on:
  schedule:
    # GitHub schedules are UTC. Dubai has no DST: 01:37 UTC = 05:37 GST,
    # and 05:17 UTC = 09:17 GST. The second run is a recovery window.
    - cron: "37 1 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      morning_date:
        description: "Internal watchdog retry date (YYYY-MM-DD, Asia/Dubai); leave empty for manual runs"
        required: false
        default: ""
        type: string
      publication_only:
        description: "Publish an already staged, evidence-ready draft without researching a new story"
        required: false
        default: false
        type: boolean
      research_only:
        description: "Test normal discovery, research and staging without approving or publishing any draft"
        required: false
        default: false
        type: boolean
      retry_failed_research:
        description: "Retry a previously failed research cluster after a confirmed pipeline repair"
        required: false
        default: false
        type: boolean
      candidate_key:
        description: "Run one reviewed, version-controlled editorial candidate instead of the automatic score queue"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - dld-initial-registration
      curated_candidate_key:
        description: "Stage one human-edited candidate through fresh direct evidence, then run the bounded publication gate"
        required: false
        default: none
        type: choice
        options:
          - none
          - dld-initial-registration-2026-09-07
          - rak-h1-housing-2026-09-02
          - adgm-h1-growth-2026-09-08
          - prestige-one-investment-2026-09-10
concurrency:
  group: news-cron-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate research-only dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.research_only
        shell: bash
        env:
          PUBLICATION_ONLY: ${{ inputs.publication_only }}
          CURATED_CANDIDATE: ${{ inputs.curated_candidate_key }}
          MANUAL_LLM_CANDIDATE: ${{ inputs.candidate_key }}
          MORNING_DATE: ${{ inputs.morning_date }}
        run: |
          if [ "$PUBLICATION_ONLY" = "true" ] || [ "$CURATED_CANDIDATE" != "none" ] || [ "$MANUAL_LLM_CANDIDATE" != "auto" ] || [ -n "$MORNING_DATE" ]; then
            echo "::error title=Research-only news test::Research-only mode cannot be combined with publication-only mode, a curated or manual candidate, or a watchdog morning date."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsx scripts/test-developer-source-registry.ts
      - run: npx tsx scripts/test-abu-dhabi-media-office-source.ts
      - run: npx tsx scripts/test-source-truth-reporting.ts
      - run: npx tsx scripts/test-cluster-relevance.ts
      - run: npx tsx scripts/test-news-repair-citations.ts
      - run: npx tsx scripts/test-research-originality.ts
      - run: npx tsx scripts/test-news-cron-outcome.ts
      - run: npx tsx scripts/test-news-research-only.ts
      - run: npx tsx scripts/test-provider-retry.ts
      - run: npx tsx scripts/test-news-short-update.ts
      - run: npx tsx scripts/test-announcement-policy.ts
      - run: npx tsx scripts/test-attributed-announcement.ts
      - run: npx tsx scripts/test-curated-media-reuse.ts
      - run: npx tsx scripts/test-daily-media-catalog.ts
      - run: npx tsx scripts/test-daily-media-reuse.ts
      - run: npx tsx scripts/test-daily-media-github.ts
      - run: npx tsx scripts/test-daily-media-publication.ts
      - run: npx tsx scripts/test-daily-media-display.ts
      - run: npx tsx scripts/test-news-candidate-quarantine.ts
      - run: npx tsx scripts/test-news-draft-quarantine.ts
      - run: npx tsx scripts/test-news-manual-candidate.ts
      - run: npx tsx scripts/test-news-curated-candidate.ts
      - run: npx tsx scripts/test-news-curated-transport.ts
      - run: npx tsx scripts/test-news-scheduler.ts
      - run: npx tsx scripts/check-source-health.ts
      - name: Validate curated dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.curated_candidate_key != 'none'
        shell: bash
        env:
          MANUAL_LLM_CANDIDATE: ${{ inputs.candidate_key }}
          PUBLICATION_ONLY: ${{ inputs.publication_only }}
        run: |
          if [ "$MANUAL_LLM_CANDIDATE" != "auto" ] || [ "$PUBLICATION_ONLY" = "true" ]; then
            echo "::error title=Curated news candidate::Choose either one curated candidate, the manual LLM candidate, or publication-only mode."
            exit 1
          fi
      - name: Stage selected curated candidate
        id: curated
        if: github.event_name == 'workflow_dispatch' && inputs.curated_candidate_key != 'none'
        run: npx tsx scripts/stage-curated-candidate.ts
        env:
          SITE_URL: https://news.investwithraj.com
          POST_PUBLISH_SECRET: ${{ secrets.POST_PUBLISH_SECRET }}
          CURATED_CANDIDATE_KEY: ${{ inputs.curated_candidate_key }}
      - name: Run daily news pipeline
        id: pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.curated_candidate_key == 'none' || steps.curated.outputs.already_published != '1'
        run: npx tsx scripts/draft-once.ts
        env:
          SITE_URL: https://news.investwithraj.com
          POST_PUBLISH_SECRET: ${{ secrets.POST_PUBLISH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Reviewed manual targets stage first so their exact generated copy
          # can be inspected before a separate publication-only run.
          # Research-only dispatches always use the same discovery/staging path
          # but cannot enter assessment, approval or publication.
          AUTO_APPROVE: ${{ github.event_name == 'workflow_dispatch' && inputs.research_only && '0' || (github.event_name == 'workflow_dispatch' && inputs.curated_candidate_key != 'none' && '1' || (github.event_name == 'workflow_dispatch' && inputs.candidate_key != 'auto' && '0' || '1')) }}
          AUTO_PUBLISH_LIMIT: "1"
          CURATED_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.curated_candidate_key != 'none' && '1' || '0' }}
          CURATED_CANDIDATE_KEY: ${{ inputs.curated_candidate_key }}
          AUTO_APPROVE_TARGET_DRAFT_ID: ${{ steps.curated.outputs.draft_id }}
          AUTO_APPROVE_TARGET_CONTENT_HASH: ${{ steps.curated.outputs.content_hash }}
          AUTO_APPROVE_TARGET_SLUG: ${{ steps.curated.outputs.slug }}
          # Scheduled runs and the Vercel watchdog share one Dubai-day lane.
          # Ordinary workflow_dispatch and curated/manual paths remain outside
          # this guard and keep their existing behaviour.
          AUTOMATED_MORNING_LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.research_only && '0' || (github.event_name == 'schedule' && '1' || (inputs.morning_date != '' && '1' || '0')) }}
          MORNING_DATE: ${{ inputs.morning_date || '' }}
          # One Dubai-morning run researches and may publish the newest passing
          # website-news item. Manual recovery runs use the same bounded lane.
          DRAFT_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.research_only && '1' || (github.event_name == 'workflow_dispatch' && (inputs.publication_only || inputs.curated_candidate_key != 'none') && '0' || '1') }}
          AUTO_PUBLISH_ORDER: "newest"
          AUTO_BACKLOG_MIN_AGE_HOURS: "12"
          AUTO_BACKLOG_MAX_AGE_DAYS: "21"
          AUTO_REDRAFT_MIN_AGE_HOURS: "24"
          NEWS_STALE_AFTER_HOURS: "36"
          # Failed research clusters remain quarantined unless an operator
          # explicitly confirms a repair and requests one bounded retry.
          PIPELINE_RETRY_FAILED: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_failed_research && '1' || '0' }}
          PIPELINE_CANDIDATE_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_key || 'auto' }}
      - name: Surface daily news outcome
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.curated_candidate_key == 'none' || steps.curated.outputs.already_published != '1')
        shell: bash
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outputs.outcome }}
          PIPELINE_OUTCOMES: ${{ steps.pipeline.outputs.outcomes }}
          PUBLICATION_SHA: ${{ steps.pipeline.outputs.publication_sha }}
          NEWEST_PUBLICATION_AGE_HOURS: ${{ steps.pipeline.outputs.newest_publication_age_hours }}
          SHOULD_FAIL: ${{ steps.pipeline.outputs.should_fail }}
          ACTIONABLE_REASONS: ${{ steps.pipeline.outputs.actionable_reasons }}
        run: |
          if [ -z "$PIPELINE_OUTCOME" ]; then
            echo "::error title=Daily news pipeline::The pipeline exited without an outcome receipt."
            exit 1
          fi
          if [ "$SHOULD_FAIL" = "1" ] || [ "$PIPELINE_OUTCOME" = "failed" ]; then
            echo "::error title=Daily news pipeline::outcome=$PIPELINE_OUTCOME; outcomes=$PIPELINE_OUTCOMES; publication_sha=$PUBLICATION_SHA; newest_age_hours=$NEWEST_PUBLICATION_AGE_HOURS; action=$ACTIONABLE_REASONS"
            exit 1
          fi
          echo "::notice title=Daily news pipeline::outcome=$PIPELINE_OUTCOME; outcomes=$PIPELINE_OUTCOMES; publication_sha=$PUBLICATION_SHA; newest_age_hours=$NEWEST_PUBLICATION_AGE_HOURS; action=$ACTIONABLE_REASONS"
      - name: Surface curated no-op
        if: github.event_name == 'workflow_dispatch' && inputs.curated_candidate_key != 'none' && steps.curated.outputs.already_published == '1'
        run: echo "::notice title=Curated news candidate::The exact candidate is already published; no draft or publication action was taken."
