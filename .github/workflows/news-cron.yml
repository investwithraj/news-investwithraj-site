name: news-cron
on:
  schedule:
    - cron: "7 3 * * *"
    - cron: "7 9 * * *"
    - cron: "7 15 * * *"
  workflow_dispatch: {}
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsx scripts/draft-once.ts
        env:
          SITE_URL: https://news.investwithraj.com
          POST_PUBLISH_SECRET: ${{ secrets.POST_PUBLISH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_APPROVE: "1"
          AUTO_PUBLISH_LIMIT: "1"
          # Morning researches + publishes the latest story. Midday and evening
          # skip paid drafting and publish the strongest still-timely backlog item.
          DRAFT_ENABLED: ${{ github.event_name == 'workflow_dispatch' && '1' || (github.event.schedule == '7 3 * * *' && '1' || '0') }}
          AUTO_PUBLISH_ORDER: ${{ github.event_name == 'workflow_dispatch' && 'newest' || (github.event.schedule == '7 3 * * *' && 'newest' || 'backlog') }}
          AUTO_BACKLOG_MIN_AGE_HOURS: "12"
          AUTO_BACKLOG_MAX_AGE_DAYS: "21"
