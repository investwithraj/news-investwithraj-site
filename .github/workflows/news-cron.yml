name: news-cron
on:
  schedule:
    - cron: "7 3 * * *"
    - cron: "7 9 * * *"
    - cron: "7 15 * * *"
  workflow_dispatch: {}
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsx scripts/test-developer-source-registry.ts
      - run: npx tsx scripts/test-news-cron-outcome.ts
      - run: npx tsx scripts/check-source-health.ts
      - name: Run daily news pipeline
        id: pipeline
        run: npx tsx scripts/draft-once.ts
        env:
          SITE_URL: https://news.investwithraj.com
          POST_PUBLISH_SECRET: ${{ secrets.POST_PUBLISH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_APPROVE: "1"
          AUTO_PUBLISH_LIMIT: "1"
          # Morning researches + publishes the latest story. Midday and evening
          # skip paid drafting and publish the strongest still-timely backlog item.
          DRAFT_ENABLED: ${{ github.event_name == 'workflow_dispatch' && '1' || (github.event.schedule == '7 3 * * *' && '1' || '0') }}
          AUTO_PUBLISH_ORDER: ${{ github.event_name == 'workflow_dispatch' && 'newest' || (github.event.schedule == '7 3 * * *' && 'newest' || 'backlog') }}
          AUTO_BACKLOG_MIN_AGE_HOURS: "12"
          AUTO_BACKLOG_MAX_AGE_DAYS: "21"
          # A manual recovery run may retry failed (never processing/staged)
          # reservations immediately after a pipeline fix.
          PIPELINE_RETRY_FAILED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Surface daily news outcome
        if: always()
        shell: bash
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outputs.outcome }}
          PIPELINE_OUTCOMES: ${{ steps.pipeline.outputs.outcomes }}
          PUBLICATION_SHA: ${{ steps.pipeline.outputs.publication_sha }}
          NEWEST_PUBLICATION_AGE_HOURS: ${{ steps.pipeline.outputs.newest_publication_age_hours }}
        run: |
          if [ -z "$PIPELINE_OUTCOME" ]; then
            echo "::error title=Daily news pipeline::The pipeline exited without an outcome receipt."
            exit 1
          fi
          echo "::notice title=Daily news pipeline::outcome=$PIPELINE_OUTCOME; outcomes=$PIPELINE_OUTCOMES; publication_sha=$PUBLICATION_SHA; newest_age_hours=$NEWEST_PUBLICATION_AGE_HOURS"
